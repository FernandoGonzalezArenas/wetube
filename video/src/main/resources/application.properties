# ==============================================================
# 1. CONFIGURACION GENERAL Y RED
# ==============================================================
spring.application.name=video
server.port=8082

# ==============================================================
# 2. BASE DE DATOS (PostgreSQL)
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/videodb}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${user_db}
spring.datasource.password=${password_db}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#visualizar las consultas en la consola
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

# ==============================================================
# 4. DISCOVERY & CONFIG (Consul)
# ==============================================================
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=8500
spring.config.import=optional:consul:
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.prefer-ip-address=true

# Habilitar Actuator para monitoreo y salud
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always

# ==============================================================
# 5. STORAGE: AWS S3 & MINIO
# ==============================================================
# AWS S3
aws.s3.bucket-videos=wetube-videos
aws.s3.region=us-east-1
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}

# MinIO (Local/S3 compatible)
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-videos=wetube-videos

#cambiar entre servicios de almacenamiento
storage.type=${STORAGE_TYPE:minio}

# ==============================================================
# 6. CIRCUIT BREAKER (Resilience4j)
# ==============================================================
# Configuraci�n com�n
#expone el estado de el circuito en actuator o una herramienta de monitoreo similar (estado abierto o cerrado)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
#analiza las ultimas 10 llamadas a el servicio requerido (en este caso comments)
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10

# Instancia para Comment Service
#si el 50% de las llamadas fayan se abre el circuito para protejer a video
resilience4j.circuitbreaker.instances.comments.failureRateThreshold=50
#el circuito permanecera abierto por 15 segundos
resilience4j.circuitbreaker.instances.comments.waitDurationInOpenState=15s
#despues de los 15 segundos se haran 3 llamadas para saber si el servicio comments ahora si responde
resilience4j.circuitbreaker.instances.comments.permittedNumberOfCallsInHalfOpenState=3

# Instancia para Like Service
resilience4j.circuitbreaker.instances.likes.failureRateThreshold=50
resilience4j.circuitbreaker.instances.likes.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.likes.permittedNumberOfCallsInHalfOpenState=3

#instancia para microservicio subscription
resilience4j.circuitbreaker.instances.subscription.failureRateThreshold=50
resilience4j.circuitbreaker.instances.subscription.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.subscription.permittedNumberOfCallsInHalfOpenState=3

#instancia para microservicio user
resilience4j.circuitbreaker.instances.user.failureRateThreshold=50
resilience4j.circuitbreaker.instances.user.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.user.permittedNumberOfCallsInHalfOpenState=3

# ==============================================================
# 7. FEIGN CLIENTS (Timeouts)
# ==============================================================
# Evita que el microservicio se quede colgado esperando a otros
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000

#configuracion de rabbitMQ
spring.rabbitmq.host=${RABBIT_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBIT_USER:guest}
spring.rabbitmq.password=${RABBIT_PASSWORD:guest}

#configuracion de documentacion
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/videos/v3/api-docs
