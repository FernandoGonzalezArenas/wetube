# ==============================================================
# 1. CONFIGURACION GENERAL Y RED
# ==============================================================
spring.application.name=video
server.port=8082

# ==============================================================
# 2. BASE DE DATOS (PostgreSQL)
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/videodb}
spring.datasource.username=${user_db}
spring.datasource.password=${password_db}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format-sql=true

# ==============================================================
# 3. SEGURIDAD (JWT) 
# Importante: jwt.secret debe ser id�ntico al de Auth para validar
# ==============================================================
jwt.secret=${JWT_SECRET}

# ==============================================================
# 4. DISCOVERY & CONFIG (Consul)
# ==============================================================
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=8500
spring.config.import=optional:consul:${spring.cloud.consul.host}:${spring.cloud.consul.port}
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.prefer-ip-address=true

# Habilitar Actuator para monitoreo y salud
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always

# ==============================================================
# 5. STORAGE: AWS S3 & MINIO
# ==============================================================
# AWS S3
aws.s3.bucket-name=bucket-videos
aws.s3.region=us-east-1
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}

# MinIO (Local/S3 compatible)
minio.url=http://localhost:9000
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=bucket-videos

#cambiar entre servicios de almacenamiento
storage.type=minio

# ==============================================================
# 6. CIRCUIT BREAKER (Resilience4j)
# ==============================================================
# Configuraci�n com�n
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.slidingWindowSize=10

# Instancia para Comment Service
resilience4j.circuitbreaker.instances.comment-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.comment-service.waitDurationInOpenState=15s
resilience4j.circuitbreaker.instances.comment-service.permittedNumberOfCallsInHalfOpenState=3

# Instancia para Like Service
resilience4j.circuitbreaker.instances.like-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.like-service.waitDurationInOpenState=10s

# ==============================================================
# 7. FEIGN CLIENTS (Timeouts)
# ==============================================================
# Evita que el microservicio se quede colgado esperando a otros
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000