server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: "optional:consul:"
  cloud:
    loadbalancer:
      cache:
        enabled: true
        ttl: 5s
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: 8500
      discovery:
        instance-id: ${spring.application.name}:${random.value}
        health-check-path: /actuator/health
        health-check-interval: 10s
        prefer-ip-address: true
    gateway:
      globalcors:
        add-to-chain: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true
      default-filters:
        - name: DedupeResponseHeader
          args:
            name: Access-Control-Allow-Origin Access-Control-Allow-Credentials
            strategy: RETAIN_FIRST
      routes:
        #ruta para microservicio auth
        - id: auth
          uri: lb://auth
          predicates:
            - Path=/auth/**

#microservicio admin
        - id: admin
          uri: lb://admin
          predicates:
            - Path=/admin/**

#servicio local de almacenamiento minio
        - id: minio_route
          uri: http://minio:9000
          predicates:
            - Path=/storage/**
          filters:
            - RewritePath=/storage/(?<segment>.*), /${segment}

        #ruta para microservicio user
        - id: user
          uri: lb://user
          predicates:
            - Path=/users/**

#ruta para microservicio subscriptions
        - id: subscription
          uri: lb://subscription
          predicates:
            - Path=/subs/**

        #ruta para microservicio video
        - id: video
          uri: lb://video
          predicates:
              - Path=/videos/**

        #ruta de microservicio comments
        - id: comments
          uri: lb://comments
          predicates:
            - Path=/comentarios/**
        #ruta de microservicio likes
        - id: likes
          uri: lb://likes
          predicates:
            - Path=/like/**
#seguridad JWT
jwt:
  secret: ${JWT_SECRET}

  #configuracion de documentacion
springdoc:
  swagger-ui:
    urls:
      - name: "Servicio de auth"
        url: "/auth/v3/api-docs"
      - name: "Servicio de admin"
        url: "/admin/v3/api-docs"
      - name: "Servicio de user"
        url: "/users/v3/api-docs"
      - name: "Servicio de video"
        url: "/videos/v3/api-docs"
      - name: "Servicio de subscripcion"
        url: "/subs/v3/api-docs"
      - name: "Servicio de comentarios"
        url: "/comentarios/v3/api-docs"
      - name: "Servicio de likes"
        url: "/like/v3/api-docs"
